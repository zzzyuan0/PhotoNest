services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: photonest-postgres
    environment:
      POSTGRES_DB: photonest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d photonest']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: photonest-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: photonest-minio
    profiles:
      - object-sim
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: photonest
      MINIO_ROOT_PASSWORD: photonest-dev-password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: photonest-minio-init
    profiles:
      - object-sim
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 photonest photonest-dev-password &&
        mc mb --ignore-existing local/photonest-main &&
        mc mb --ignore-existing local/photonest-backup
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
