openapi: 3.1.0
info:
  title: PhotoNest API
  version: 0.2.0
  summary: 统一照片库的认证、导入、发现与安全控制接口骨架
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Auth
  - name: Import
  - name: Discovery
  - name: Assets
  - name: Backup
  - name: Settings
  - name: Debug
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: 获取 API 与依赖健康状态
      operationId: getHealth
      responses:
        '200':
          description: 健康检查结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 使用 bootstrap 凭据创建认证会话
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并返回会话与访问令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: 获取当前认证会话
      operationId: getCurrentSession
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      responses:
        '200':
          description: 当前会话信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/recent:
    post:
      tags: [Auth]
      summary: 刷新近期认证状态
      operationId: refreshRecentAuthentication
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRecentAuthRequest'
      responses:
        '200':
          description: 已刷新近期认证状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/import/sessions:
    post:
      tags: [Import]
      summary: 创建导入会话
      operationId: createImportSession
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImportSessionRequest'
      responses:
        '201':
          description: 导入会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSession'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/import/sessions/{sessionId}/uploads:
    post:
      tags: [Import]
      summary: 为上传对象签发预签名信息
      operationId: createUploadTicket
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadTicketRequest'
      responses:
        '201':
          description: 上传凭据已签发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/import/sessions/{sessionId}/confirm:
    post:
      tags: [Import]
      summary: 确认上传结果并闭合导入状态机
      operationId: confirmUpload
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequest'
      responses:
        '202':
          description: 上传已确认并开始后续处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAcceptedResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/discovery/timeline:
    get:
      tags: [Discovery]
      summary: 获取按时间线排列的资产摘要
      operationId: listTimelineAssets
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: stage
          in: query
          required: false
          schema:
            type: string
        - name: backupStatus
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 时间线结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/discovery/places:
    get:
      tags: [Discovery]
      summary: 获取地点聚合浏览结果
      operationId: listPlaceSummaries
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 地点聚合结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/discovery/duplicates:
    get:
      tags: [Discovery]
      summary: 获取重复照片审查候选
      operationId: listDuplicateCandidates
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 重复候选结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicatesResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/discovery/search:
    get:
      tags: [Discovery]
      summary: 以统一授权边界执行搜索
      operationId: searchAssets
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/albums:
    get:
      tags: [Discovery]
      summary: 获取收藏和精选相册列表
      operationId: listAlbums
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200':
          description: 相册列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Discovery]
      summary: 创建精选相册
      operationId: createAlbum
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlbumRequest'
      responses:
        '201':
          description: 相册已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/albums/{albumId}:
    get:
      tags: [Discovery]
      summary: 获取单个相册及其资产
      operationId: getAlbumDetail
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AlbumId'
        - $ref: '#/components/parameters/LibraryId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 相册详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetailResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/albums/{albumId}/assets:
    post:
      tags: [Discovery]
      summary: 向相册添加资产
      operationId: addAlbumAsset
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAlbumAssetRequest'
      responses:
        '200':
          description: 相册已更新
          content:
            application/json:
              schema:
                type: object
                required: [status, albumId, assetId]
                properties:
                  status:
                    type: string
                  albumId:
                    type: string
                    format: uuid
                  assetId:
                    type: string
                    format: uuid
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/assets/{assetId}:
    get:
      tags: [Assets]
      summary: 获取单个资产详情
      operationId: getAssetDetail
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200':
          description: 资产详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/assets/{assetId}/favorite:
    put:
      tags: [Discovery]
      summary: 更新资产收藏状态
      operationId: setFavoriteAsset
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFavoriteRequest'
      responses:
        '200':
          description: 收藏状态已更新
          content:
            application/json:
              schema:
                type: object
                required: [status, assetId, favorite]
                properties:
                  status:
                    type: string
                  assetId:
                    type: string
                    format: uuid
                  favorite:
                    type: boolean
                  album:
                    $ref: '#/components/schemas/AlbumSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/assets/{assetId}/download:
    post:
      tags: [Assets]
      summary: 为单个资产申请受控下载访问
      operationId: requestAssetDownload
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '202':
          description: 下载访问已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadGrant'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/assets/batch-downloads:
    post:
      tags: [Assets]
      summary: 创建批量下载请求
      operationId: createBatchDownload
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDownloadRequest'
      responses:
        '202':
          description: 批量下载请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDownloadJob'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/exports:
    post:
      tags: [Backup]
      summary: 创建导出任务
      operationId: createExportJob
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: 导出任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/settings/providers/{providerName}:
    put:
      tags: [Settings]
      summary: 更新 Provider 设置
      operationId: updateProviderSettings
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ProviderName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderSettingsRequest'
      responses:
        '200':
          description: Provider 设置已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettingsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/settings/privacy-policy:
    put:
      tags: [Settings]
      summary: 更新隐私策略
      operationId: updatePrivacyPolicy
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivacyPolicyRequest'
      responses:
        '200':
          description: 隐私策略已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPolicy'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/debug/provider-runs/{runId}:
    get:
      tags: [Debug]
      summary: 查看 Provider 调试保留记录
      operationId: getProviderRunDebug
      security:
        - bearerAuth: []
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: 调试保留信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderRunDebugRecord'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PhotonestSessionToken
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: photonest_session
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderName:
      name: providerName
      in: path
      required: true
      schema:
        type: string
    AlbumId:
      name: albumId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LibraryId:
      name: libraryId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: 标准错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
    CursorPageInfo:
      type: object
      required: [hasNextPage]
      properties:
        nextCursor:
          type: string
        hasNextPage:
          type: boolean
    HealthCheck:
      type: object
      required: [name, healthy, checkedAt]
      properties:
        name:
          type: string
        healthy:
          type: boolean
        detail:
          type: string
        checkedAt:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, failed]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RefreshRecentAuthRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
    AuthSession:
      type: object
      required:
        [
          id,
          subjectId,
          displayName,
          roles,
          libraryIds,
          authMethod,
          authenticatedAt,
          recentAuthAt,
          expiresAt,
          csrfToken,
        ]
      properties:
        id:
          type: string
        subjectId:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        libraryIds:
          type: array
          items:
            type: string
        authMethod:
          type: string
        authenticatedAt:
          type: string
          format: date-time
        recentAuthAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
    AuthSessionResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/AuthSession'
        accessToken:
          type: string
        csrfToken:
          type: string
    CreateImportSessionRequest:
      type: object
      required: [libraryId, source]
      properties:
        libraryId:
          type: string
          format: uuid
        source:
          type: string
          enum: [web-upload, desktop-batch, export-restore]
        expectedItemCount:
          type: integer
          minimum: 1
        note:
          type: string
    ImportSession:
      type: object
      required: [id, libraryId, status, source, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, awaiting-upload, uploaded, confirmed, failed]
        source:
          type: string
        expiresAt:
          type: string
          format: date-time
    CreateUploadTicketRequest:
      type: object
      required: [libraryId, fileName, contentType, contentLength]
      properties:
        libraryId:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        contentLength:
          type: integer
          minimum: 1
        contentSha256:
          type: string
        multipart:
          type: boolean
          default: false
    UploadTicket:
      type: object
      required: [sessionId, objectKey, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        objectKey:
          type: string
        method:
          type: string
          enum: [PUT, POST]
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        formFields:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        checksumAlgorithm:
          type: string
        multipart:
          $ref: '#/components/schemas/MultipartUploadTicket'
    MultipartUploadTicket:
      type: object
      required: [uploadId, expiresAt, parts]
      properties:
        uploadId:
          type: string
        expiresAt:
          type: string
          format: date-time
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MultipartUploadPart'
    MultipartUploadPart:
      type: object
      required: [partNumber, uploadUrl]
      properties:
        partNumber:
          type: integer
          minimum: 1
        uploadUrl:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
    ConfirmUploadRequest:
      type: object
      required: [libraryId, objectKey, contentLength]
      properties:
        libraryId:
          type: string
          format: uuid
        objectKey:
          type: string
        contentLength:
          type: integer
          minimum: 1
        etag:
          type: string
        contentSha256:
          type: string
        uploadId:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/CompletedUploadPart'
    CompletedUploadPart:
      type: object
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
        etag:
          type: string
    AssetAcceptedResponse:
      type: object
      required: [assetId, importSessionId, processingStage]
      properties:
        assetId:
          type: string
          format: uuid
        importSessionId:
          type: string
          format: uuid
        processingStage:
          type: string
          enum:
            [
              accepted,
              stored,
              derivatives-ready,
              metadata-ready,
              ai-ready,
              indexed,
              partial-failure,
            ]
    AssetSummary:
      type: object
      required: [assetId, mediaType, timelineTimestamp, processingStage, backupStatus, searchReady]
      properties:
        assetId:
          type: string
          format: uuid
        mediaType:
          type: string
        timelineTimestamp:
          type: string
          format: date-time
        processingStage:
          type: string
        backupStatus:
          type: string
        thumbnailToken:
          type: string
        captionPreview:
          type: string
        ocrPreview:
          type: string
        locationLabel:
          type: string
        tags:
          type: array
          items:
            type: string
        semanticTags:
          type: array
          items:
            type: string
        searchReady:
          type: boolean
        recognitionStatusNote:
          type: string
    TimelineResponse:
      type: object
      required: [libraryId, items, pageInfo]
      properties:
        libraryId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetSummary'
        pageInfo:
          $ref: '#/components/schemas/CursorPageInfo'
    PlaceSummary:
      type: object
      required: [label, count, latestAt, latestAsset]
      properties:
        label:
          type: string
        count:
          type: integer
        latestAt:
          type: string
          format: date-time
        latestAsset:
          $ref: '#/components/schemas/AssetSummary'
    PlacesResponse:
      type: object
      required: [libraryId, items]
      properties:
        libraryId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceSummary'
    DuplicateCandidate:
      type: object
      required: [primary, candidate, exact]
      properties:
        primary:
          $ref: '#/components/schemas/AssetSummary'
        candidate:
          $ref: '#/components/schemas/AssetSummary'
        exact:
          type: boolean
    DuplicatesResponse:
      type: object
      required: [libraryId, items]
      properties:
        libraryId:
          type: string
          format: uuid
        items:
          type: array
