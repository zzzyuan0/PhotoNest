# 这个文件用来展示统一配置层支持的三类秘密来源：
# 1. env: 通过环境变量注入
# 2. secretRef: 通过外部 Secret Manager 或自定义解析器引用
# 3. encrypted: 在配置文件中存储密文，并用环境变量提供解密密钥

database:
  password:
    env: PHOTONEST_DATABASE_PASSWORD

storageProviders:
  primary:
    accessKeyId:
      secretRef: secret://photonest/cos-primary#secret-id
    accessKeySecret:
      encrypted:
        ciphertext: BASE64_CIPHERTEXT_HERE
        nonce: BASE64_NONCE_HERE
        keyEnv: PHOTONEST_DEBUG_ENCRYPTION_KEY_BASE64
        aad: photonest-primary

aiProviders:
  - name: remote-openai
    token:
      env: PHOTONEST_AI_OPENAI_TOKEN
